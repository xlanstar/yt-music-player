# The terminal ytm is captured in (scripts/repo-images.sh): kitty in the
# brand's dark colors, the size of a small window. ytm paints with the
# terminal's own colors: bright black is its muted text, bright red its
# accent (amber).
font_family Menlo
font_size 13
initial_window_width 80c
initial_window_height 22c
remember_window_size no
window_padding_width 10
macos_titlebar_color background
macos_show_window_title_in window
confirm_os_window_close 0

background #0e0d0b
foreground #eee7d9
color0 #0e0d0b
color8 #a8a196
color9 #ffa630
