<!doctype html>
<!-- README's top image (1280×640), in philosophy.md: the window, and ytm
     in a terminal over its corner, on the water below a halftone sun, the
     light both doors open on. No headline: the README's title says it.
     ?theme=dark renders the one for GitHub's dark mode. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<script>
  if (new URLSearchParams(location.search).get("theme") === "dark") {
    document.documentElement.classList.add("dark");
  }
</script>
<style>
  .app-window { left: 56px; top: 56px; width: 760px; }
  /* Over the window's queue, which it shows too. */
  .app-terminal { right: 56px; bottom: 56px; width: 450px; }
</style>
</head>
<body data-horizon="232" data-sun="1048 176" data-reflection="6">
  <canvas id="art"></canvas>
  <img class="app-window" src="app-window.png" alt="">
  <img class="app-terminal" src="app-terminal.png" alt="">
  <div class="label" style="left: 56px; bottom: 56px">Fig. 1 <span class="lc">&nbsp; one player, three doors</span></div>
  <script src="art.js"></script>
</body>
</html>
