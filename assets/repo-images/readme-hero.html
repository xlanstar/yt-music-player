<!doctype html>
<!-- README's top image (1280×640): only the window, no text (the README's
     title says it). ?theme=dark renders the one for GitHub's dark mode. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<script>
  if (new URLSearchParams(location.search).get("theme") === "dark") {
    document.documentElement.classList.add("dark");
  }
</script>
<style>
  html, body { width: 1280px; height: 640px; }
  .glow { left: 50%; top: 50%; width: 1300px; height: 1100px; transform: translate(-50%, -45%); }
  .app-window { left: 50%; top: 44px; width: 960px; transform: translateX(-50%); }
</style>
</head>
<body>
  <div class="glow"></div>
  <img class="app-window" src="app-window.png" alt="">
</body>
</html>
