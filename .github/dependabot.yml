# Go modules and the workflows' actions (pinned by commit, docs/release.md),
# weekly. Each pull request runs CI's prek. Minor and patch bumps come as one
# pull request per ecosystem; majors come alone, since they may need code
# changes. A release must be a week old first, so a hijacked one is likely
# caught before it lands here. Neither .tool-versions nor prek.toml's revs
# are covered: Dependabot reads neither.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
