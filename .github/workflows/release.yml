# Builds a vX.Y.Z tag, which scripts/release.sh pushes, into a draft GitHub
# release (docs/release.md). Each job has only the permissions it needs:
# only publish, which builds and tests nothing, can write, and only the
# build jobs, in the release environment that v* tags alone may use, have
# the signing secrets.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  # First, so that a wrong tag builds nothing.
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main, which must hold the tag
          persist-credentials: false
      - run: scripts/release.sh check "$GITHUB_REF_NAME"

  checks:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  macos:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 45 # notarization: usually minutes, sometimes far longer
    environment: release
    permissions:
      contents: read
    env:
      MACOS_SIGNING_IDENTITY: "Developer ID Application: PENG HUAN CHENG (LJJN3L2PS6)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # A keychain of the job's own, discarded with the runner.
      - name: Import the certificate and the notary credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id LJJN3L2PS6 --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # Only here: mygo.json signs nothing, so builds elsewhere stay ad hoc
      # and need no notary credentials. mygo staples the app before it
      # archives it, so the update carries the ticket too.
      - name: Build, sign, notarize and sign the update
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          jq --indent 2 --arg k "$NOTARY_KEYCHAIN" \
            '.macos.notarize = {keychainProfile: "notary", keychain: $k}' \
            mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" mygo.json
          scripts/build.sh -platform darwin/universal -sign "$MACOS_SIGNING_IDENTITY"

      # A release that Gatekeeper would stop never becomes a draft.
      - name: Check the signature and the tickets
        run: |
          app="build/darwin-universal/YT Music Player.app"
          dmg="build/darwin-universal/YT Music Player ${GITHUB_REF_NAME#v}.dmg"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"

      # The app plays through ytmd and ships ytm, for both architectures.
      - name: Check ytmd and ytm
        run: |
          res="build/darwin-universal/YT Music Player.app/Contents/Resources"
          helper="$res/YT Music Player Helper.app"
          for exe in "$helper/Contents/MacOS/ytmd" "$res/ytm"; do
            case $(file -b "$exe") in
            *"universal binary with 2 architectures"*) ;;
            *)
              echo "::error::$exe is not a universal binary"
              exit 1
              ;;
            esac
            lipo "$exe" -verify_arch arm64
            lipo "$exe" -verify_arch x86_64
            codesign --verify --strict "$exe"
          done
          codesign --verify --strict "$helper"
          plutil -lint "$helper/Contents/Info.plist"
          [ "$(plutil -extract CFBundleShortVersionString raw "$helper/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}" ]

      # The update files keep their names: the manifest links to them.
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          out=build/darwin-universal
          archive="$out/yt-music-player-$version-darwin-universal.tar.gz"
          manifest="$out/update-darwin-universal.json"
          if [ ! -f "$archive" ] || [ ! -f "$manifest" ]; then
            echo "::error::no signed update: is MYGO_UPDATER_PRIVATE_KEY in the release environment?"
            exit 1
          fi
          tar -tzf "$archive" > "$RUNNER_TEMP/archive.txt"
          for exe in "YT Music Player Helper.app/Contents/MacOS/ytmd" ytm; do
            if ! grep -qx "\(\./\)\{0,1\}YT Music Player.app/Contents/Resources/$exe" "$RUNNER_TEMP/archive.txt"; then
              echo "::error::the update has no $exe"
              exit 1
            fi
          done
          mkdir dist
          cp "$out/YT Music Player $version.dmg" \
            "dist/YT-Music-Player-$version-macos-universal.dmg"
          cp "$archive" "$manifest" dist/
          # Deltas from the published versions; the first release has none.
          for delta in "$out"/*.delta; do
            [ ! -e "$delta" ] || cp "$delta" dist/
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # MyGo needs no cgo, so Ubuntu cross-compiles Linux and Windows, a job
  # for each system and both its architectures; Ubuntu's NSIS makes the
  # Windows installers. No certificate signs them: SmartScreen warns.
  linux-windows:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false # so that a rerun builds only the failed system
      matrix:
        os: [linux, windows]
    env:
      TARGET_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install NSIS
        if: matrix.os == 'windows'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis

      - name: Build and sign the updates
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: scripts/build.sh -platform "$TARGET_OS/amd64,$TARGET_OS/arm64"

      # The update files keep their names: the manifests link to them.
      # Linux's archive is also what install.sh installs. Each package
      # holds ytmd and ytm, for its architecture, next to the app.
      - name: Check and package
        run: |
          version="${GITHUB_REF_NAME#v}"
          # code <file> <arch>: the file is code for arch.
          code() {
            case $2:$(file -b "$1") in
            amd64:*x86-64* | arm64:*[Aa]arch64* | arm64:*ARM64*) ;; # file 5.46 names PE's ARM64
            *)
              echo "::error::$1 is not built for $2"
              exit 1
              ;;
            esac
          }
          # holds <what> <list> <path>…: the list of what's files has each path.
          holds() {
            what=$1 list=$2
            shift 2
            for path in "$@"; do
              if ! grep -qx "\(\./\)\{0,1\}$path" "$list"; then
                echo "::error::$what has no $path"
                exit 1
              fi
            done
          }
          list="$RUNNER_TEMP/files.txt"
          mkdir dist
          for arch in amd64 arm64; do
            target="$TARGET_OS-$arch"
            out="build/$target"
            archive="$out/yt-music-player-$version-$target.tar.gz"
            manifest="$out/update-$target.json"
            if [ ! -f "$archive" ] || [ ! -f "$manifest" ]; then
              echo "::error::no signed update for $target: is MYGO_UPDATER_PRIVATE_KEY in the release environment?"
              exit 1
            fi
            if [ "$TARGET_OS" = linux ]; then
              exe="$out/yt-music-player"
              helpers="ytmd ytm"
              deb="$out/yt-music-player_${version}_$arch.deb"
              dpkg-deb -c "$deb" | awk '{ print $6 }' > "$list"
              holds "$deb" "$list" opt/yt-music-player/ytmd opt/yt-music-player/ytm \
                opt/yt-music-player/ytmd.service usr/bin/ytm
              cp "$deb" "dist/YT-Music-Player-$version-$target.deb"
            else
              exe="$out/YT Music Player.exe"
              helpers="ytmd.exe ytm.exe"
              # ytmd runs without a console window, ytm in the terminal.
              file -b "$out/ytmd.exe" | grep -q '(GUI)' || { echo "::error::$out/ytmd.exe opens a console"; exit 1; }
              file -b "$out/ytm.exe" | grep -q '(console)' || { echo "::error::$out/ytm.exe has no console"; exit 1; }
              cp "$out/YT Music Player Setup $version $arch.exe" "dist/YT-Music-Player-$version-$target-setup.exe"
            fi
            tar -tzf "$archive" > "$list"
            for f in $helpers; do
              code "$out/$f" "$arch"
              holds "$archive" "$list" "$f"
            done
            code "$exe" "$arch"
            cp "$archive" "$manifest" dist/
            for delta in "$out"/*.delta; do
              [ ! -e "$delta" ] || cp "$delta" dist/
            done
          done
          # One script for every architecture: it reads the machine's manifest.
          if [ "$TARGET_OS" = linux ]; then
            cmp build/linux-amd64/install.sh build/linux-arm64/install.sh
            cp build/linux-amd64/install.sh dist/
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [macos, linux-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the draft release
      id-token: write # the attestation's signing certificate
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A directory for each build job's files, rather than a merge, in
      # which a name two jobs made would silently keep one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts

      - name: Gather the files and their SHA256SUMS
        run: |
          mkdir dist
          for job in macos linux windows; do
            [ -d "artifacts/release-$job" ] || { echo "::error::no files from $job"; exit 1; }
          done
          for f in artifacts/*/*; do
            if [ -e "dist/${f##*/}" ]; then
              echo "::error::two build jobs made ${f##*/}"
              exit 1
            fi
            mv "$f" dist/
          done
          cd dist && shasum -a 256 -- * > SHA256SUMS

      # Free plans attest public repositories only.
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          scripts/release.sh notes "${GITHUB_REF_NAME#v}" > "$notes"
          # A rerun replaces the files of its draft, never of a published release.
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::$GITHUB_REF_NAME is already published"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
